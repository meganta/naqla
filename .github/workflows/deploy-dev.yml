name: deploy-dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: deploy to dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: configure docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: build and push api
        run: |
          docker build -t ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-${{ github.sha }} apps/api
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-${{ github.sha }}
          docker tag ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-${{ github.sha }} \
                     ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-latest
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-latest

      - name: build and push migrate
        run: |
          docker build -f apps/api/Dockerfile.migrate \
            -t ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-migrate:dev-${{ github.sha }} apps/api
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-migrate:dev-${{ github.sha }}

      - name: build and push worker
        run: |
          docker build -t ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-${{ github.sha }} services/worker
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-${{ github.sha }}
          docker tag ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-${{ github.sha }} \
                     ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-latest
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-latest

      - name: build and push frontend
        run: |
          docker build -t ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-${{ github.sha }} apps/frontend
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-${{ github.sha }}
          docker tag ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-${{ github.sha }} \
                     ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-latest
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-latest

      - name: run database migrations
        run: |
          IMAGE=${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-migrate:dev-${{ github.sha }}
          REGION=${{ vars.GCP_REGION }}
          PROJECT=${{ vars.GCP_PROJECT_ID }}
          JOB=naqla-migrate-dev
          ARGS="--image=$IMAGE --region=$REGION --service-account=${{ vars.GCP_API_SA }} --set-secrets=DATABASE_URL=naqla-db-password-dev:latest --set-env-vars=ENVIRONMENT=dev --set-cloudsql-instances=naqla-mvp:europe-west1:naqla-db-dev --max-retries=1 --project=$PROJECT"
          if gcloud run jobs describe $JOB --region=$REGION --project=$PROJECT &>/dev/null; then
            gcloud run jobs update $JOB $ARGS
          else
            gcloud run jobs create $JOB $ARGS
          fi
          gcloud run jobs execute $JOB --region=$REGION --project=$PROJECT --wait

      - name: deploy api
        run: |
          gcloud run deploy naqla-api-dev \
            --image=${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-${{ github.sha }} \
            --region=${{ vars.GCP_REGION }} \
            --service-account=${{ vars.GCP_API_SA }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=5 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=120 \
            --set-env-vars="ENVIRONMENT=dev,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_REGION=${{ vars.GCP_REGION }},GCS_BUCKET_NAME=naqla-uploads-dev,CLOUD_TASKS_QUEUE=naqla-ingestion-dev,CLOUD_TASKS_LOCATION=${{ vars.GCP_REGION }},AI_PROVIDER=openai,AI_MODEL=gpt-4o-mini,CORS_ORIGINS_STR=https://naqla-frontend-dev-uagnx6q44q-ew.a.run.app,WORKER_SERVICE_URL=https://naqla-worker-dev-uagnx6q44q-ew.a.run.app,FRONTEND_URL=https://naqla-frontend-dev-uagnx6q44q-ew.a.run.app,API_URL=https://naqla-api-dev-uagnx6q44q-ew.a.run.app" \
            --set-secrets="JWT_SECRET=naqla-jwt-secret-dev:latest,GEMINI_API_KEY=naqla-gemini-api-key-dev:latest,OPENAI_API_KEY=naqla-openai-api-key-dev:latest,DATABASE_URL=naqla-db-password-dev:latest,YOUTUBE_API_KEY=naqla-youtube-api-key-dev:latest,GOOGLE_CLIENT_ID=naqla-google-client-id-dev:latest,GOOGLE_CLIENT_SECRET=naqla-google-client-secret-dev:latest,SUPADATA_API_KEY=naqla-supadata-api-key-dev:latest" \
            --set-cloudsql-instances=naqla-mvp:europe-west1:naqla-db-dev \
            --project=${{ vars.GCP_PROJECT_ID }}

      - name: route traffic to latest api revision
        run: |
          LATEST=$(gcloud run revisions list \
            --service=naqla-api-dev \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --format="value(name)" \
            --limit=1)
          gcloud run services update-traffic naqla-api-dev \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --to-revisions=$LATEST=100

      - name: allow unauthenticated access to api
        run: |
          gcloud run services add-iam-policy-binding naqla-api-dev \
            --region=${{ vars.GCP_REGION }} \
            --member=allUsers \
            --role=roles/run.invoker \
            --project=${{ vars.GCP_PROJECT_ID }}

      - name: deploy worker
        run: |
          gcloud run deploy naqla-worker-dev \
            --image=${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-${{ github.sha }} \
            --region=${{ vars.GCP_REGION }} \
            --service-account=${{ vars.GCP_WORKER_SA }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --min-instances=1 \
            --max-instances=3 \
            --memory=4Gi \
            --cpu=2 \
            --timeout=3600 \
            --set-env-vars="ENVIRONMENT=dev,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_REGION=${{ vars.GCP_REGION }},GCS_BUCKET_NAME=naqla-uploads-dev,AI_PROVIDER=openai,AI_MODEL=gpt-4o-mini" --set-secrets="DATABASE_URL=naqla-db-password-dev:latest,OPENAI_API_KEY=naqla-openai-api-key-dev:latest,GEMINI_API_KEY=naqla-gemini-api-key-dev:latest,YOUTUBE_API_KEY=naqla-youtube-api-key-dev:latest,GOOGLE_CLIENT_ID=naqla-google-client-id-dev:latest,GOOGLE_CLIENT_SECRET=naqla-google-client-secret-dev:latest,SUPADATA_API_KEY=naqla-supadata-api-key-dev:latest" --add-cloudsql-instances=naqla-mvp:europe-west1:naqla-db-dev \
            --project=${{ vars.GCP_PROJECT_ID }}

      - name: deploy frontend
        run: |
          gcloud run deploy naqla-frontend-dev \
            --image=${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-${{ github.sha }} \
            --region=${{ vars.GCP_REGION }} \
            --service-account=${{ vars.GCP_FRONTEND_SA }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=30 \
            --set-env-vars="ENVIRONMENT=dev,NEXT_PUBLIC_API_URL=https://naqla-api-dev-uagnx6q44q-ew.a.run.app" \
            --project=${{ vars.GCP_PROJECT_ID }}

      - name: smoke test
        run: |
          API_URL=$(gcloud run services describe naqla-api-dev \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --format="value(status.url)")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health")
          echo "Health check: $STATUS at $API_URL"
          if [ "$STATUS" != "200" ]; then exit 1; fi
          echo "Smoke test passed"
