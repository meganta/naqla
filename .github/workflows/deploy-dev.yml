name: deploy-dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: deploy to dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: configure docker for artifact registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: build and push api
        run: |
          docker build -t ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-${{ github.sha }} apps/api
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-${{ github.sha }}
          docker tag ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-${{ github.sha }} \
                     ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-latest
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-latest

      - name: build and push worker
        run: |
          docker build -t ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-${{ github.sha }} services/worker
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-${{ github.sha }}
          docker tag ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-${{ github.sha }} \
                     ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-latest
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-latest

      - name: build and push frontend
        run: |
          docker build -t ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-${{ github.sha }} apps/frontend
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-${{ github.sha }}
          docker tag ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-${{ github.sha }} \
                     ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-latest
          docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-latest

      - name: deploy api to cloud run dev
        run: |
          gcloud run deploy naqla-api-dev \
            --image=${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-api:dev-${{ github.sha }} \
            --region=${{ vars.GCP_REGION }} \
            --service-account=${{ vars.GCP_API_SA }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=5 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=30 \
            --set-env-vars="ENVIRONMENT=dev,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_REGION=${{ vars.GCP_REGION }},GCS_BUCKET_NAME=naqla-uploads-dev,CLOUD_TASKS_QUEUE=naqla-ingestion-dev,CLOUD_TASKS_LOCATION=${{ vars.GCP_REGION }},AI_PROVIDER=gemini,AI_MODEL=gemini-1.5-flash" \
            --set-secrets="JWT_SECRET=naqla-jwt-secret-dev:latest,GEMINI_API_KEY=naqla-gemini-api-key-dev:latest" \
            --project=${{ vars.GCP_PROJECT_ID }}

      - name: allow unauthenticated access to api
        run: |
          gcloud run services add-iam-policy-binding naqla-api-dev \
            --region=${{ vars.GCP_REGION }} \
            --member=allUsers \
            --role=roles/run.invoker \
            --project=${{ vars.GCP_PROJECT_ID }}

      - name: deploy worker to cloud run dev
        run: |
          gcloud run deploy naqla-worker-dev \
            --image=${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-worker:dev-${{ github.sha }} \
            --region=${{ vars.GCP_REGION }} \
            --service-account=${{ vars.GCP_WORKER_SA }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --set-env-vars="ENVIRONMENT=dev,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_REGION=${{ vars.GCP_REGION }},GCS_BUCKET_NAME=naqla-uploads-dev,AI_PROVIDER=gemini,AI_MODEL=gemini-1.5-flash" \
            --set-secrets="GEMINI_API_KEY=naqla-gemini-api-key-dev:latest" \
            --project=${{ vars.GCP_PROJECT_ID }}

      - name: deploy frontend to cloud run dev
        run: |
          gcloud run deploy naqla-frontend-dev \
            --image=${{ vars.GCP_ARTIFACT_REGISTRY }}/naqla-frontend:dev-${{ github.sha }} \
            --region=${{ vars.GCP_REGION }} \
            --service-account=${{ vars.GCP_FRONTEND_SA }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=30 \
            --set-env-vars="ENVIRONMENT=dev,NEXT_PUBLIC_API_URL=https://naqla-api-dev-placeholder.run.app" \
            --project=${{ vars.GCP_PROJECT_ID }}

      - name: smoke test
        run: |
          API_URL=$(gcloud run services describe naqla-api-dev \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --format="value(status.url)")
          echo "API URL: $API_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed"
            exit 1
          fi
          echo "Smoke test passed"
