services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naqla
      POSTGRES_PASSWORD: naqla
      POSTGRES_DB: naqla_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naqla"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://naqla:naqla@postgres:5432/naqla_dev
      JWT_SECRET: local-dev-secret
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      GCP_PROJECT_ID: naqla-mvp
      GCP_REGION: europe-west1
      GCS_BUCKET_NAME: naqla-uploads-dev
      CLOUD_TASKS_QUEUE: naqla-ingestion-dev
      CLOUD_TASKS_LOCATION: europe-west1
      AI_PROVIDER: gemini
      AI_MODEL: gemini-1.5-flash
      GEMINI_API_KEY: ${GEMINI_API_KEY:-placeholder}
      WORKER_SERVICE_URL: http://worker:8001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: services/worker
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://naqla:naqla@postgres:5432/naqla_dev
      GCP_PROJECT_ID: naqla-mvp
      GCP_REGION: europe-west1
      GCS_BUCKET_NAME: naqla-uploads-dev
      AI_PROVIDER: gemini
      AI_MODEL: gemini-1.5-flash
      GEMINI_API_KEY: ${GEMINI_API_KEY:-placeholder}
      API_SERVICE_URL: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/worker:/app
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
